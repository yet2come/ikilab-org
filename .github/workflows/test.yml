name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json の engines.node と Cloudflare Pages のビルドイメージに合わせる。
          # tests/ は node が .ts を直接実行するため、型剥がしが既定で有効な 22.18.0 以上が必要
          node-version: "22.23.4"
          cache: npm

      - run: npm ci

      - run: npm test
